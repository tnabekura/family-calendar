<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>わが家のカレンダー Ver.4</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#263247;background:#f4f6fa}*{box-sizing:border-box}body{margin:0}main{max-width:760px;margin:auto;padding:16px 12px 100px}header,.bar,.tabs,.flex{display:flex;align-items:center;justify-content:space-between;gap:8px}h1{font-size:22px;margin:8px 0}h2{font-size:18px}.muted{color:#68758a;font-size:13px}.panel{background:white;border-radius:16px;padding:14px;box-shadow:0 2px 14px #1b35510b;margin:12px 0}button,input,select,textarea{font:inherit}button{border:0;border-radius:10px;background:#eaf0fb;color:#24446f;padding:10px 13px;cursor:pointer}button.primary{background:#376dd5;color:white}button.danger{background:#fff0f0;color:#b32b3c}.month{font-size:20px;font-weight:700}.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;margin:12px 0}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}.weekday{text-align:center;font-size:12px;color:#68758a;padding:8px 0}.day{min-height:73px;background:#f6f8fc;border-radius:7px;padding:5px 3px;cursor:pointer;border:2px solid transparent;overflow:hidden}.day.out{opacity:.4}.day.active{border-color:#376dd5;background:#eaf1ff}.day.today .num{background:#376dd5;color:white;border-radius:50%}.num{font-size:12px;display:inline-grid;place-items:center;width:23px;height:23px}.chip{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:3px;margin-top:3px;padding:2px;color:#263247}.event{padding:10px;border-radius:10px;background:#f6f8fc;margin:7px 0;display:flex;justify-content:space-between;align-items:center;gap:6px}.event>div{min-width:0}.event strong{overflow-wrap:anywhere}.tabs{position:fixed;bottom:0;left:0;right:0;max-width:760px;margin:auto;background:white;padding:12px max(12px,env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom));box-shadow:0 -2px 12px #0001}.tabs button{flex:1;font-size:13px}.tabs button.selected{background:#376dd5;color:white}label{display:block;font-size:13px;margin:12px 0 5px;font-weight:600}input:not([type=checkbox]),select,textarea{width:100%;border:1px solid #d5dce8;border-radius:9px;padding:11px;background:white}textarea{min-height:70px}.hide{display:none}.item{padding:10px 0;border-bottom:1px solid #edf0f5;display:flex;align-items:center;gap:10px}.item span{flex:1;overflow-wrap:anywhere}.done{text-decoration:line-through;color:#8490a0}.note{padding:12px;border-radius:10px;background:#f5f7fc;margin:8px 0;overflow-wrap:anywhere}.notice{background:#fff6e1;color:#745019;padding:11px;border-radius:10px;font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}@media(min-width:600px){.day{min-height:100px}.chip{font-size:12px}}
.notice.ok{background:#e7f6ed;color:#206443}#firebaseConfig{min-height:110px;font-family:monospace;font-size:12px}
.day{min-height:75px}.statusline{font-size:12px;margin-top:6px}.readonly{opacity:.55;pointer-events:none}.tiny{font-size:12px;color:#68758a}.tabs button{line-height:1.5}#migrationPanel{border:1px solid #e6bc69}button:disabled{opacity:.5;cursor:not-allowed}</style></head><body><main><header><div><h1>🏠 わが家のカレンダー</h1><div class="muted">家族4人の予定・買い物・伝言</div></div><button id="settingsBtn" aria-label="設定">⚙️</button></header>
<div class="notice" id="syncNotice">接続確認中…</div><div class="statusline muted" id="lastSync"></div>
<section id="calendarPage"><div class="panel"><div class="bar"><button id="prev">❮</button><div class="month" id="monthTitle"></div><div class="flex"><button id="todayBtn">今日</button><button id="next">❯</button></div></div><div class="legend" id="legend"></div><div class="calendar" id="calendar"></div></div><div class="panel"><div class="bar"><h2 id="selectedTitle"></h2><button class="primary" id="addEvent">＋ 予定追加</button></div><div id="eventList"></div></div></section>
<section id="shoppingPage" class="hide"><div class="panel"><h2>🛒 買い物メモ</h2><form id="shopForm" class="flex"><input id="shopInput" maxlength="100" placeholder="買うものを入力" required><button class="primary">追加</button></form><div id="shopList"></div></div></section>
<section id="messagesPage" class="hide"><div class="panel"><h2>💬 家族の伝言板</h2><form id="messageForm"><label>投稿者</label><select id="messageAuthor"></select><label>伝言</label><textarea id="messageText" maxlength="1000" required></textarea><div class="actions"><button class="primary">投稿する</button></div></form><div id="messageList"></div></div></section>
<section id="settingsPage" class="hide"><div class="panel"><h2>☁️ 同期とログイン</h2><div class="actions"><button class="primary" id="loginGoogle">Googleでログイン</button><button id="logoutCloud">ログアウト</button></div><p id="cloudStatus" class="muted"></p><p>あなたのUID：<strong id="myUid">未ログイン</strong></p><button id="copyUid">UIDをコピー</button><p class="tiny">オフラインでは最後に同期したデータを閲覧できます。編集はオンライン時のみ可能です。</p></div>
<div class="panel" id="migrationPanel"><h2>🔄 旧バージョンからの移行</h2><p id="migrationText">移行状態を確認中…</p><button class="primary" id="migrateBtn" disabled>旧データを引き継ぐ（管理者のみ）</button><p class="tiny">移行は1回だけ。旧データは削除しません。移行前に旧カレンダーでJSONバックアップを保存し、家族全員の編集を止めてください。</p></div>
<div class="panel"><h2>⚙️ 家族の名前</h2><p class="tiny">変更は管理者だけ。色は固定です。</p><div id="nameFields"></div><button class="primary" id="saveNames">名前を保存</button></div><div class="panel"><h2>バックアップ</h2><button id="exportBtn">データをJSONで保存</button></div></section>
<section id="eventEditor" class="hide"><div class="panel"><div class="bar"><h2 id="editorTitle">予定を追加</h2><button id="cancelEdit">閉じる</button></div><form id="eventForm"><label>日付</label><input id="eventDate" type="date" required><label>誰の予定？</label><select id="eventPerson"></select><label>時刻（任意）</label><input id="eventTime" type="time"><label>予定</label><input id="eventTitle" maxlength="150" required><label>メモ（任意）</label><textarea id="eventMemo" maxlength="1000"></textarea><div class="actions"><button class="primary">保存する</button><button type="button" class="danger hide" id="deleteEvent">削除する</button></div></form></div></section></main>
<nav class="tabs"><button data-page="calendar" class="selected">📅 カレンダー</button><button data-page="shopping">🛒 買い物</button><button data-page="messages">💬 伝言板</button></nav>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import {getAuth,GoogleAuthProvider,signInWithPopup,signInWithRedirect,getRedirectResult,signOut,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
import {getFirestore,doc,collection,getDoc,getDocs,setDoc,updateDoc,deleteDoc,onSnapshot,runTransaction,writeBatch} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';
const config = {apiKey:"AIzaSyD5ZGPQSnE1Y9mcMQd73LzNsFQUAnAYnVg",authDomain:"project-calendar-a09b7.firebaseapp.com",projectId:"project-calendar-a09b7",storageBucket:"project-calendar-a09b7.firebasestorage.app",messagingSenderId:"619830191003",appId:"1:619830191003:web:5f67be4ba77fa5bc8b373e"};
const app=initializeApp(config),auth=getAuth(app),db=getFirestore(app),provider=new GoogleAuthProvider();
const $=id=>document.getElementById(id),colors=['#4285f4','#e8799a','#32a879','#e5a23b'],base=['families','home'];
const settingsRef=doc(db,...base,'settings','profile'),legacyRef=doc(db,...base,'shared','calendar');
const col=k=>collection(db,...base,k),ref=(k,id)=>doc(db,...base,k,id);
const defaults=()=>({names:['家族①','家族②','家族③','家族④'],events:[],shopping:[],messages:[]});
let data=defaults(),currentUid=null,admin=false,ready=false,migrated=false,online=navigator.onLine,unsubs=[],generation=0,editId=null,editRevision=0;
let today=new Date(),selected=fmt(today),view=new Date(today.getFullYear(),today.getMonth(),1);
let loaded=new Set(),legacyExists=false,legacyPayload=null;
function fmt(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function textEl(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e}
function setStatus(s,good=false){$('syncNotice').textContent=s;$('cloudStatus').textContent=s;$('syncNotice').classList.toggle('ok',good)}
function err(e){setStatus('操作エラー：'+(e?.message||e));alert('保存できませんでした：'+(e?.message||e))}
function cacheKey(){return 'family-calendar-v4-cache-'+currentUid}
function loadCache(){if(!currentUid)return;try{const c=JSON.parse(localStorage.getItem(cacheKey()));if(c&&Array.isArray(c.names)&&c.names.length===4){data=c;render()}}catch{}}
function cache(){if(!currentUid)return;try{localStorage.setItem(cacheKey(),JSON.stringify(data));localStorage.setItem('family-calendar-v4-last-sync-'+currentUid,new Date().toISOString())}catch{};syncTime()}
function syncTime(){if(!currentUid)return;const t=localStorage.getItem('family-calendar-v4-last-sync-'+currentUid);$('lastSync').textContent=t?'最終同期：'+new Date(t).toLocaleString('ja-JP')+'（オフラインではこの時点の情報）':''}
function canEdit(){return !!currentUid&&online&&ready&&migrated}
function guard(){if(!canEdit()){alert('編集にはオンライン接続と移行完了が必要です');return false}return true}
function controls(){const active=canEdit();['addEvent','saveNames','migrateBtn'].forEach(id=>{if(id==='saveNames')$(id).disabled=!active||!admin;else if(id==='addEvent')$(id).disabled=!active});$('shopForm').querySelector('button').disabled=!active;$('messageForm').querySelector('button').disabled=!active;$('migrateBtn').disabled=!online||!currentUid||!admin||migrated||!legacyExists||!ready;document.querySelectorAll('#nameFields input').forEach(x=>x.disabled=!active||!admin)}
function page(p){['calendar','shopping','messages','settings'].forEach(x=>$(x+'Page').classList.add('hide'));$('eventEditor').classList.add('hide');if(p==='eventEditor')$('eventEditor').classList.remove('hide');else $(p+'Page').classList.remove('hide');document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('selected',b.dataset.page===p));scrollTo(0,0)}
function opts(el,all=false){const old=el.value;el.replaceChildren();data.names.forEach((n,i)=>el.add(new Option(n,String(i))));if(all)el.add(new Option('家族全員','all'));if([...el.options].some(x=>x.value===old))el.value=old}
function render(){opts($('eventPerson'),true);opts($('messageAuthor'));$('legend').replaceChildren();data.names.forEach((n,i)=>{const s=textEl('span'),dot=textEl('span','dot');dot.style.background=colors[i];s.append(dot,document.createTextNode(n));$('legend').append(s)});$('monthTitle').textContent=`${view.getFullYear()}年${view.getMonth()+1}月`;const c=$('calendar');c.replaceChildren();'日月火水木金土'.split('').forEach(x=>c.append(textEl('div','weekday',x)));const offset=view.getDay(),days=new Date(view.getFullYear(),view.getMonth()+1,0).getDate(),count=Math.ceil((offset+days)/7)*7;for(let i=0;i<count;i++){const d=new Date(view.getFullYear(),view.getMonth(),1-offset+i),key=fmt(d);const cell=textEl('div','day'+(d.getMonth()!==view.getMonth()?' out':'')+(key===selected?' active':'')+(key===fmt(today)?' today':''));cell.tabIndex=0;cell.setAttribute('role','button');cell.append(textEl('span','num',d.getDate()));const ev=data.events.filter(e=>e.date===key).sort((a,b)=>(a.time||'').localeCompare(b.time||''));ev.slice(0,3).forEach(e=>{const chip=textEl('div','chip',(e.time?e.time+' ':'')+e.title);chip.style.background=e.person==='all'?'#dce0e9':colors[Number(e.person)]+'40';cell.append(chip)});if(ev.length>3)cell.append(textEl('div','muted',`他${ev.length-3}件`));const choose=()=>{selected=key;view=new Date(d.getFullYear(),d.getMonth(),1);render()};cell.onclick=choose;cell.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();choose()}};c.append(cell)}$('selectedTitle').textContent=selected.replaceAll('-','/')+' の予定';$('eventList').replaceChildren();const events=data.events.filter(e=>e.date===selected).sort((a,b)=>(a.time||'').localeCompare(b.time||''));if(!events.length)$('eventList').append(textEl('p','muted','予定はありません'));events.forEach(e=>{const row=textEl('div','event'),info=textEl('div');info.append(textEl('strong','',(e.time?e.time+'　':'')+e.title),textEl('div','muted',e.person==='all'?'家族全員':data.names[Number(e.person)]||'家族'));if(e.memo)info.append(textEl('div','muted',e.memo));const b=textEl('button','','編集');b.disabled=!canEdit();b.onclick=()=>openEditor(e);row.append(info,b);$('eventList').append(row)});renderShop();renderMessages();renderNames();controls()}
function renderShop(){$('shopList').replaceChildren();data.shopping.forEach(item=>{const row=textEl('div','item'),check=document.createElement('input');check.type='checkbox';check.checked=!!item.done;check.disabled=!canEdit();check.onchange=async()=>{if(!guard())return;check.disabled=true;try{await runTransaction(db,async t=>{const r=ref('shopping',item.id),s=await t.get(r);if(!s.exists())throw Error('すでに削除されています');t.update(r,{done:check.checked,revision:(s.data().revision||0)+1})})}catch(e){err(e)}finally{check.disabled=false}};const txt=textEl('span',item.done?'done':'',item.text),del=textEl('button','danger','削除');del.disabled=!canEdit();del.onclick=async()=>{if(!guard()||!confirm('削除しますか？'))return;try{await deleteDoc(ref('shopping',item.id))}catch(e){err(e)}};row.append(check,txt,del);$('shopList').append(row)})}
function renderMessages(){$('messageList').replaceChildren();[...data.messages].sort((a,b)=>(b.created||'').localeCompare(a.created||'')).forEach(m=>{const note=textEl('div','note'),head=textEl('div','bar'),del=textEl('button','danger','削除');del.disabled=!canEdit();del.onclick=async()=>{if(!guard()||!confirm('伝言を削除しますか？'))return;try{await deleteDoc(ref('messages',m.id))}catch(e){err(e)}};head.append(textEl('strong','',data.names[Number(m.author)]||'家族'),textEl('span','muted',new Date(m.created).toLocaleString('ja-JP')),del);note.append(head,textEl('div','',m.text));$('messageList').append(note)})}
function renderNames(){const active=document.activeElement?.id;if(active?.startsWith('name')&&$('settingsPage').classList.contains('hide')===false)return;$('nameFields').replaceChildren();data.names.forEach((n,i)=>{const label=textEl('label','',`家族${i+1}`),input=document.createElement('input');input.id='name'+i;input.maxLength=30;input.value=n;$('nameFields').append(label,input)})}
function openEditor(e){if(!guard())return;editId=e?.id||null;editRevision=e?.revision||0;$('editorTitle').textContent=e?'予定を編集':'予定を追加';$('eventDate').value=e?.date||selected;$('eventPerson').value=e?.person||'0';$('eventTime').value=e?.time||'';$('eventTitle').value=e?.title||'';$('eventMemo').value=e?.memo||'';$('deleteEvent').classList.toggle('hide',!e);page('eventEditor')}
$('eventForm').onsubmit=async e=>{e.preventDefault();if(!guard())return;const value={date:$('eventDate').value,person:$('eventPerson').value,time:$('eventTime').value,title:$('eventTitle').value.trim(),memo:$('eventMemo').value.trim()};if(!value.title)return;const btn=$('eventForm').querySelector('button');btn.disabled=true;try{if(editId){await runTransaction(db,async t=>{const r=ref('events',editId),s=await t.get(r);if(!s.exists()||s.data().revision!==editRevision)throw Error('他の端末で変更されています。画面を更新してから編集してください');t.update(r,{...value,revision:editRevision+1})})}else{await setDoc(ref('events',crypto.randomUUID()),{...value,revision:1})}selected=value.date;const d=new Date(selected+'T12:00:00');view=new Date(d.getFullYear(),d.getMonth(),1);page('calendar')}catch(e){err(e)}finally{btn.disabled=false}};
$('deleteEvent').onclick=async()=>{if(!guard()||!confirm('予定を削除しますか？'))return;try{await runTransaction(db,async t=>{const r=ref('events',editId),s=await t.get(r);if(!s.exists()||s.data().revision!==editRevision)throw Error('他の端末で変更されています');t.delete(r)});page('calendar')}catch(e){err(e)}};
$('cancelEdit').onclick=()=>page('calendar');$('addEvent').onclick=()=>openEditor();$('prev').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()-1,1);render()};$('next').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()+1,1);render()};$('todayBtn').onclick=()=>{today=new Date();selected=fmt(today);view=new Date(today.getFullYear(),today.getMonth(),1);render()};document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>page(b.dataset.page));$('settingsBtn').onclick=()=>page('settings');
$('shopForm').onsubmit=async e=>{e.preventDefault();if(!guard())return;const t=$('shopInput').value.trim();if(!t)return;try{await setDoc(ref('shopping',crypto.randomUUID()),{text:t,done:false,revision:1});$('shopInput').value=''}catch(e){err(e)}};
$('messageForm').onsubmit=async e=>{e.preventDefault();if(!guard())return;const t=$('messageText').value.trim();if(!t)return;try{await setDoc(ref('messages',crypto.randomUUID()),{author:$('messageAuthor').value,text:t,created:new Date().toISOString(),revision:1});$('messageText').value=''}catch(e){err(e)}};
$('saveNames').onclick=async()=>{if(!guard()||!admin)return;const names=data.names.map((x,i)=>$('name'+i).value.trim()||x);try{await updateDoc(settingsRef,{names}) ;alert('名前を保存しました')}catch(e){err(e)}};
$('exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='家族カレンダー_v4_バックアップ.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$('loginGoogle').onclick=async()=>{try{await signInWithPopup(auth,provider)}catch(e){if(e.code==='auth/popup-blocked')await signInWithRedirect(auth,provider);else err(e)}};getRedirectResult(auth).catch(err);$('logoutCloud').onclick=()=>signOut(auth).catch(err);$('copyUid').onclick=()=>{if(currentUid)navigator.clipboard.writeText(currentUid).then(()=>alert('UIDをコピーしました')).catch(()=>alert('コピーできませんでした'))};
function migrationStatus(){const t=$('migrationText');if(migrated)t.textContent='移行済み。新しい保存方式で同期しています。';else if(!currentUid)t.textContent='ログインしてください。';else if(!admin)t.textContent='管理者が移行を完了するまで閲覧専用です。';else if(!legacyExists)t.textContent='旧データが見つかりません。移行を実行せず確認してください。';else t.textContent='旧データを確認しました。バックアップを取ったあと管理者が1回だけ移行してください。';controls()}
function subscribe(){unsubs.forEach(f=>f());unsubs=[];loaded=new Set();ready=false;const gen=++generation;const fail=e=>{if(gen!==generation)return;ready=false;setStatus('Firestore接続エラー：'+e.message);controls()};
const s=onSnapshot(settingsRef,snap=>{if(gen!==generation)return;if(snap.exists()){const p=snap.data();if(Array.isArray(p.names)&&p.names.length===4)data.names=p.names;migrated=!!p.migrated;admin=!!currentUid&&currentUid===p.adminUid}else{migrated=false;admin=legacyExists}loaded.add('settings');finish()},fail);unsubs.push(s);
for(const k of ['events','shopping','messages']){unsubs.push(onSnapshot(col(k),snap=>{if(gen!==generation)return;data[k]=snap.docs.map(d=>({id:d.id,...d.data()}));loaded.add(k);finish()},fail))}
function finish(){if(gen!==generation)return;if(loaded.size===4){ready=true;cache();setStatus(migrated?'☁️ 同期中（1件ずつ安全に保存）':'移行待ち：管理者が旧データを引き継いでください',migrated);render();migrationStatus()}}}
async function inspectLegacy(){legacyExists=false;legacyPayload=null;try{const s=await getDoc(legacyRef);legacyExists=s.exists();if(legacyExists){legacyPayload=s.data().payload;if(!migrated)admin=true}}catch(e){/* members may not read legacy; only admin needs it */}migrationStatus()}
$('migrateBtn').onclick=async()=>{if(!online||!currentUid||!admin||!ready||migrated||!legacyExists)return;if(!confirm('旧カレンダーのJSONバックアップを保存しましたか？ 家族の編集を止めて移行します。'))return;const p=legacyPayload;if(!p||!Array.isArray(p.names)||p.names.length!==4||!['events','shopping','messages'].every(k=>Array.isArray(p[k]))){alert('旧データ形式が正しくありません');return}const total=p.events.length+p.shopping.length+p.messages.length;if(total>400){alert('データ件数が400件を超えています。安全な分割移行が必要なのでここで停止します。');return}const b=writeBatch(db);for(const k of ['events','shopping','messages'])for(const item of p[k]){const id=String(item.id||crypto.randomUUID());const v={...item};delete v.id;b.set(ref(k,id),{...v,revision:1})}b.set(settingsRef,{names:p.names,migrated:true,adminUid:currentUid});$('migrateBtn').disabled=true;try{await b.commit();alert(`移行完了！ ${total}件を引き継ぎました。旧データも残っています。`)}catch(e){err(e)}finally{migrationStatus()}};
onAuthStateChanged(auth,async user=>{++generation;unsubs.forEach(f=>f());unsubs=[];currentUid=user?.uid||null;admin=false;ready=false;migrated=false;loaded.clear();data=defaults();$('myUid').textContent=currentUid||'未ログイン';if(!currentUid){setStatus('未ログイン：ログインしてください');render();migrationStatus();return}loadCache();syncTime();if(!online){setStatus('📴 オフライン：最後に保存した情報を閲覧中');render();migrationStatus();return}setStatus('クラウドに接続中…');subscribe();await inspectLegacy()});
window.addEventListener('offline',()=>{online=false;ready=false;setStatus('📴 オフライン：最後に同期した情報を閲覧中');render()});window.addEventListener('online',()=>{online=true;setStatus('再接続中…');if(currentUid){subscribe();inspectLegacy()}else render()});
render();page('calendar');if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
